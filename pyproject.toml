[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defi-trend-paper-trader"
version = "0.1.0"
description = "Isolated Uniswap-v2-style trend research and paper-trading simulator"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Alexis M. Adams"}
]
license = {text = "MIT"}
keywords = ["defi", "backtesting", "paper-trading", "uniswap-v2", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
defi-trend = "defi_trend.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
